# 首次申请并部署证书，仅手动触发；定时续期使用 AutoCert.yml。

name: Certonly

permissions:
  contents: read

on:
  workflow_dispatch:

env:

  EMAIL: ${{ secrets.EMAIL }}
  CDNAccessKeyId: ${{secrets.CDNACCESSKEYID}}
  CDNAccessKeySecret: ${{secrets.CDNACCESSKEYSECRET}}
  DNSAccessKeyId: ${{secrets.DNSACCESSKEYID}}
  DNSAccessKeySecret: ${{secrets.DNSACCESSKEYSECRET}}
  DNSSecurityToken: ${{ secrets.DNSSECURITYTOKEN }}
  CDNSecurityToken: ${{ secrets.CDNSECURITYTOKEN }}


jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      id: checkout

    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@v6
      with:
        # go-version: '1.24'
        check-latest: true
        cache-dependency-path: "**/*.mod"
        go-version-file: './go.mod'


    - name: Depedency
      id: dependencies
      run: go mod tidy  && go mod download
    - name: Build
      id: compile
      run: go build -o AutoCert cmd/main.go
    - name: ${{ vars.DOMAINTOOLS || 'DOMAINTOOLS' }}
      id: apply_1
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINTOOLS}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{env.DNSAccessKeyId}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{env.DNSAccessKeySecret}}
        TASK_DNS_SECURITY_TOKEN: ${{ env.DNSSecurityToken }}
        TASK_CDN_ACCESS_KEY_ID: ${{env.CDNAccessKeyId}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{env.CDNAccessKeySecret}}
        TASK_CDN_SECURITY_TOKEN: ${{ env.CDNSecurityToken }}
      run: |
        printf '[%s] 开始首次申请并部署（DOMAINTOOLS）\n' "${TASK_DOMAIN:-未配置}"
        if ./AutoCert --certonly --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"; then
          printf '[%s] 首次申请并部署完成\n' "${TASK_DOMAIN:-未配置}"
        else
          status=$?
          printf '[%s] 首次申请或部署失败（DOMAINTOOLS），退出码 %s，具体错误见上方输出。\n' "${TASK_DOMAIN:-未配置}" "$status" >&2
        fi
    - name: ${{ vars.DOMAINCLASSROOMS || 'DOMAINCLASSROOMS' }}
