# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: AutoCert

permissions:
  contents: read

on:
  schedule:
    - cron:  '30 5 */5 * *'
  workflow_dispatch:

env:

  EMAIL: ${{ secrets.EMAIL }}
  CDNAccessKeyId: ${{secrets.CDNACCESSKEYID}}
  CDNAccessKeySecret: ${{secrets.CDNACCESSKEYSECRET}}
  DNSAccessKeyId: ${{secrets.DNSACCESSKEYID}}
  DNSAccessKeySecret: ${{secrets.DNSACCESSKEYSECRET}}
  DNSSecurityToken: ${{ secrets.DNSSECURITYTOKEN }}
  CDNSecurityToken: ${{ secrets.CDNSECURITYTOKEN }}
  

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      id: checkout

    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@v6
      with:
        # go-version: '1.24'
        check-latest: true
        cache-dependency-path: "**/*.mod"
        go-version-file: './go.mod'
      
          
    - name: Depedency
      id: dependencies
      run: go mod tidy  && go mod download
    - name: Build
      id: compile
      run: go build -o AutoCert cmd/main.go
    - name: ${{ vars.DOMAINTOOLS || 'DOMAINTOOLS' }}
      id: renew_1
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINTOOLS}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{env.DNSAccessKeyId}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{env.DNSAccessKeySecret}}
        TASK_DNS_SECURITY_TOKEN: ${{ env.DNSSecurityToken }}
        TASK_CDN_ACCESS_KEY_ID: ${{env.CDNAccessKeyId}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{env.CDNAccessKeySecret}}
        TASK_CDN_SECURITY_TOKEN: ${{ env.CDNSecurityToken }}
      run: |
        printf '[%s] 开始处理（DOMAINTOOLS）\n' "${TASK_DOMAIN:-未配置}"
        if ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"; then
          printf '[%s] 处理完成\n' "${TASK_DOMAIN:-未配置}"
        else
          status=$?
          printf '[%s] 处理失败（DOMAINTOOLS），退出码 %s，具体错误见上方输出。\n' "${TASK_DOMAIN:-未配置}" "$status" >&2
        fi
    - name: ${{ vars.DOMAINCLASSROOMS || 'DOMAINCLASSROOMS' }}
