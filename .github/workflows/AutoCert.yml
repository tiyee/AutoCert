# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: AutoCert

permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron:  '30 5 */5 * *'
  workflow_dispatch:

env:

  EMAIL: ${{ secrets.EMAIL }}
  CDNAccessKeyId: ${{secrets.CDNACCESSKEYID}}
  CDNAccessKeySecret: ${{secrets.CDNACCESSKEYSECRET}}
  DNSAccessKeyId: ${{secrets.DNSACCESSKEYID}}
  DNSAccessKeySecret: ${{secrets.DNSACCESSKEYSECRET}}
  DNSSecurityToken: ${{ secrets.DNSSECURITYTOKEN }}
  CDNSecurityToken: ${{ secrets.CDNSECURITYTOKEN }}
  

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      id: checkout

    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@v6
      with:
        # go-version: '1.24'
        check-latest: true
        cache-dependency-path: "**/*.mod"
        go-version-file: './go.mod'
      
          
    - name: Depedency
      id: dependencies
      run: go mod tidy  && go mod download
    - name: Build
      id: compile
      run: go build -o AutoCert cmd/main.go
    - name: ${{ vars.DOMAINTOOLS || 'DOMAINTOOLS' }}
      id: renew_1
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINTOOLS}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{env.DNSAccessKeyId}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{env.DNSAccessKeySecret}}
        TASK_DNS_SECURITY_TOKEN: ${{ env.DNSSecurityToken }}
        TASK_CDN_ACCESS_KEY_ID: ${{env.CDNAccessKeyId}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{env.CDNAccessKeySecret}}
        TASK_CDN_SECURITY_TOKEN: ${{ env.CDNSecurityToken }}
      run: python3 .github/scripts/renewal_report.py run --task renew_1 --variable DOMAINTOOLS -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINCLASSROOMS || 'DOMAINCLASSROOMS' }}
      id: renew_2
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINCLASSROOMS}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{env.DNSAccessKeyId}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{env.DNSAccessKeySecret}}
        TASK_DNS_SECURITY_TOKEN: ${{ env.DNSSecurityToken }}
        TASK_CDN_ACCESS_KEY_ID: ${{env.CDNAccessKeyId}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{env.CDNAccessKeySecret}}
        TASK_CDN_SECURITY_TOKEN: ${{ env.CDNSecurityToken }}
      run: python3 .github/scripts/renewal_report.py run --task renew_2 --variable DOMAINCLASSROOMS -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINICUA || 'DOMAINICUA' }}
      id: renew_3
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINICUA}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{env.DNSAccessKeyId}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{env.DNSAccessKeySecret}}
        TASK_DNS_SECURITY_TOKEN: ${{ env.DNSSecurityToken }}
        TASK_CDN_ACCESS_KEY_ID: ${{env.CDNAccessKeyId}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{env.CDNAccessKeySecret}}
        TASK_CDN_SECURITY_TOKEN: ${{ env.CDNSecurityToken }}
      run: python3 .github/scripts/renewal_report.py run --task renew_3 --variable DOMAINICUA -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINSDREAM || 'DOMAINSDREAM' }}
      id: renew_4
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSDREAM}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.AVAR_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.AVAR_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.AVAR_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.AVAR_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.AVAR_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.AVAR_CDN_SECURITY_TOKEN }}
      run: python3 .github/scripts/renewal_report.py run --task renew_4 --variable DOMAINSDREAM -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINSJW || 'DOMAINSJW' }}
      id: renew_5
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSJW}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.QT_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.QT_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.QT_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.QT_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.QT_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.QT_CDN_SECURITY_TOKEN }}
      run: python3 .github/scripts/renewal_report.py run --task renew_5 --variable DOMAINSJW -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINSQTWL || 'DOMAINSQTWL' }}
      id: renew_6
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSQTWL}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.QT_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.QT_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.QT_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.QT_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.QT_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.QT_CDN_SECURITY_TOKEN }}
      run: python3 .github/scripts/renewal_report.py run --task renew_6 --variable DOMAINSQTWL -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINVQTWL || 'DOMAINVQTWL' }}
      id: renew_7
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINVQTWL}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.QT_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.QT_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.QT_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.QT_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.QT_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.QT_CDN_SECURITY_TOKEN }}
      run: python3 .github/scripts/renewal_report.py run --task renew_7 --variable DOMAINVQTWL -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINGKZYB || 'DOMAINGKZYB' }}
      id: renew_8
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINGKZYB}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.QT_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.QT_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.QT_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.QT_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.QT_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.QT_CDN_SECURITY_TOKEN }}
      run: python3 .github/scripts/renewal_report.py run --task renew_8 --variable DOMAINGKZYB -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINSJOY || 'DOMAINSJOY' }}
      id: renew_9
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSJOY}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.SJOY_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.SJOY_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.SJOY_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.SEED_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.SEED_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.SEED_CDN_SECURITY_TOKEN }}
      run: python3 .github/scripts/renewal_report.py run --task renew_9 --variable DOMAINSJOY -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --platform=tencent --cdn-platform=aliyun --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINSSEED || 'DOMAINSSEED' }}
      id: renew_10
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSSEED}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.SSEED_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.SSEED_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.SSEED_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.SEED_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.SEED_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.SEED_CDN_SECURITY_TOKEN }}
      run: python3 .github/scripts/renewal_report.py run --task renew_10 --variable DOMAINSSEED -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --platform=tencent --cdn-platform=aliyun --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{ vars.DOMAINSJAYNA || 'DOMAINSJAYNA' }}
      id: renew_11
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSJAYNA}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.SJAYNA_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.SJAYNA_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.SJAYNA_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.SJAYNA_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.SJAYNA_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.SJAYNA_CDN_SECURITY_TOKEN }}
      run: python3 .github/scripts/renewal_report.py run --task renew_11 --variable DOMAINSJAYNA -- ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"

    - name: Report renewal results
      if: ${{ always() }}
      env:
        AUTOCERT_STEPS: ${{ toJSON(steps) }}
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/renewal_report.py summary
