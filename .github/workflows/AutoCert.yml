# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: AutoCert

permissions:
  contents: read

on:
  schedule:
    - cron:  '30 5 */5 * *'
  workflow_dispatch:

env:

  EMAIL: ${{ secrets.EMAIL }}
  CDNAccessKeyId: ${{secrets.CDNACCESSKEYID}}
  CDNAccessKeySecret: ${{secrets.CDNACCESSKEYSECRET}}
  DNSAccessKeyId: ${{secrets.DNSACCESSKEYID}}
  DNSAccessKeySecret: ${{secrets.DNSACCESSKEYSECRET}}
  DNSSecurityToken: ${{ secrets.DNSSECURITYTOKEN }}
  CDNSecurityToken: ${{ secrets.CDNSECURITYTOKEN }}
  

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      id: checkout

    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@v7.0.0
      with:
        # go-version: '1.24'
        check-latest: true
        cache-dependency-path: "**/*.mod"
        go-version-file: './go.mod'
      
          
    - name: Depedency
      id: dependencies
      run: go mod tidy  && go mod download
    - name: Build
      id: compile
      run: go build -o AutoCert cmd/main.go
    - name: ${{ vars.DOMAINTOOLS || 'DOMAINTOOLS' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINTOOLS}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{env.DNSAccessKeyId}}" --dns-access-key-secret="${{env.DNSAccessKeySecret}}" --cdn-access-key-id="${{env.CDNAccessKeyId}}" --cdn-access-key-secret="${{env.CDNAccessKeySecret}}" --dns-security-token="${{ env.DNSSecurityToken }}" --cdn-security-token="${{ env.CDNSecurityToken }}"
    - name: ${{ vars.DOMAINCLASSROOMS || 'DOMAINCLASSROOMS' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINCLASSROOMS}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{env.DNSAccessKeyId}}" --dns-access-key-secret="${{env.DNSAccessKeySecret}}" --cdn-access-key-id="${{env.CDNAccessKeyId}}" --cdn-access-key-secret="${{env.CDNAccessKeySecret}}" --dns-security-token="${{ env.DNSSecurityToken }}" --cdn-security-token="${{ env.CDNSecurityToken }}"
    - name: ${{ vars.DOMAINICUA || 'DOMAINICUA' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINICUA}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{env.DNSAccessKeyId}}" --dns-access-key-secret="${{env.DNSAccessKeySecret}}" --cdn-access-key-id="${{env.CDNAccessKeyId}}" --cdn-access-key-secret="${{env.CDNAccessKeySecret}}" --dns-security-token="${{ env.DNSSecurityToken }}" --cdn-security-token="${{ env.CDNSecurityToken }}"
    - name: ${{ vars.DOMAINSDREAM || 'DOMAINSDREAM' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINSDREAM}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{secrets.AVAR_DNS_AK}}" --dns-access-key-secret="${{secrets.AVAR_DNS_SK}}" --cdn-access-key-id="${{secrets.AVAR_CDN_AK}}" --cdn-access-key-secret="${{secrets.AVAR_CDN_SK}}" --dns-security-token="${{ secrets.AVAR_DNS_SECURITY_TOKEN }}" --cdn-security-token="${{ secrets.AVAR_CDN_SECURITY_TOKEN }}"
    - name: ${{ vars.DOMAINSJW || 'DOMAINSJW' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINSJW}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{secrets.QT_DNS_AK}}" --dns-access-key-secret="${{secrets.QT_DNS_SK}}" --cdn-access-key-id="${{secrets.QT_CDN_AK}}" --cdn-access-key-secret="${{secrets.QT_CDN_SK}}" --dns-security-token="${{ secrets.QT_DNS_SECURITY_TOKEN }}" --cdn-security-token="${{ secrets.QT_CDN_SECURITY_TOKEN }}"
    - name: ${{ vars.DOMAINSQTWL || 'DOMAINSQTWL' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINSQTWL}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{secrets.QT_DNS_AK}}" --dns-access-key-secret="${{secrets.QT_DNS_SK}}" --cdn-access-key-id="${{secrets.QT_CDN_AK}}" --cdn-access-key-secret="${{secrets.QT_CDN_SK}}" --dns-security-token="${{ secrets.QT_DNS_SECURITY_TOKEN }}" --cdn-security-token="${{ secrets.QT_CDN_SECURITY_TOKEN }}"
    - name: ${{ vars.DOMAINVQTWL || 'DOMAINVQTWL' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINVQTWL}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{secrets.QT_DNS_AK}}" --dns-access-key-secret="${{secrets.QT_DNS_SK}}" --cdn-access-key-id="${{secrets.QT_CDN_AK}}" --cdn-access-key-secret="${{secrets.QT_CDN_SK}}" --dns-security-token="${{ secrets.QT_DNS_SECURITY_TOKEN }}" --cdn-security-token="${{ secrets.QT_CDN_SECURITY_TOKEN }}"
    - name: ${{ vars.DOMAINGKZYB || 'DOMAINGKZYB' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINGKZYB}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{secrets.QT_DNS_AK}}" --dns-access-key-secret="${{secrets.QT_DNS_SK}}" --cdn-access-key-id="${{secrets.QT_CDN_AK}}" --cdn-access-key-secret="${{secrets.QT_CDN_SK}}" --dns-security-token="${{ secrets.QT_DNS_SECURITY_TOKEN }}" --cdn-security-token="${{ secrets.QT_CDN_SECURITY_TOKEN }}"
    - name: ${{ vars.DOMAINSJOY || 'DOMAINSJOY' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINSJOY}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{secrets.SJOY_DNS_AK}}" --dns-access-key-secret="${{secrets.SJOY_DNS_SK}}" --cdn-access-key-id="${{secrets.SEED_CDN_AK}}" --cdn-access-key-secret="${{secrets.SEED_CDN_SK}}" --platform=tencent --cdn-platform=aliyun --dns-security-token="${{ secrets.SJOY_DNS_SECURITY_TOKEN }}" --cdn-security-token="${{ secrets.SEED_CDN_SECURITY_TOKEN }}"
    - name: ${{ vars.DOMAINSSEED || 'DOMAINSSEED' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINSSEED}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{secrets.SSEED_DNS_AK}}" --dns-access-key-secret="${{secrets.SSEED_DNS_SK}}" --cdn-access-key-id="${{secrets.SEED_CDN_AK}}" --cdn-access-key-secret="${{secrets.SEED_CDN_SK}}" --platform=tencent --cdn-platform=aliyun --dns-security-token="${{ secrets.SSEED_DNS_SECURITY_TOKEN }}" --cdn-security-token="${{ secrets.SEED_CDN_SECURITY_TOKEN }}"
    - name: ${{ vars.DOMAINSJAYNA || 'DOMAINSJAYNA' }}
      continue-on-error: true
      run: ./AutoCert --renew --domain="${{vars.DOMAINSJAYNA}}" --email="${{env.EMAIL}}" --product=cdn --dns-access-key-id="${{secrets.SJAYNA_DNS_AK}}" --dns-access-key-secret="${{secrets.SJAYNA_DNS_SK}}" --cdn-access-key-id="${{secrets.SJAYNA_CDN_AK}}" --cdn-access-key-secret="${{secrets.SJAYNA_CDN_SK}}" --dns-security-token="${{ secrets.SJAYNA_DNS_SECURITY_TOKEN }}" --cdn-security-token="${{ secrets.SJAYNA_CDN_SECURITY_TOKEN }}"
