# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: AutoCert

on:
  schedule:
    - cron:  '30 5 */5 * *'
  workflow_dispatch:

env:

  EMAIL: ${{ secrets.EMAIL }}
  CDNAccessKeyId: ${{secrets.CDNACCESSKEYID}}
  CDNAccessKeySecret: ${{secrets.CDNACCESSKEYSECRET}}
  DNSAccessKeyId: ${{secrets.DNSACCESSKEYID}}
  DNSAccessKeySecret: ${{secrets.DNSACCESSKEYSECRET}}
  DNSSecurityToken: ${{ secrets.DNSSECURITYTOKEN }}
  CDNSecurityToken: ${{ secrets.CDNSECURITYTOKEN }}
  

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        # go-version: '1.24'
        check-latest: true
        cache-dependency-path: "**/*.mod"
        go-version-file: './go.mod'
      
          
    - name: Depedency
      run: go mod tidy  && go mod download
    - name: Build
      run: go build -o AutoCert cmd/main.go
    - name: ${{vars.DOMAINTOOLS}}
      id: renew_1
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINTOOLS}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{env.DNSAccessKeyId}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{env.DNSAccessKeySecret}}
        TASK_DNS_SECURITY_TOKEN: ${{ env.DNSSecurityToken }}
        TASK_CDN_ACCESS_KEY_ID: ${{env.CDNAccessKeyId}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{env.CDNAccessKeySecret}}
        TASK_CDN_SECURITY_TOKEN: ${{ env.CDNSecurityToken }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINCLASSROOMS}}
      id: renew_2
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINCLASSROOMS}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{env.DNSAccessKeyId}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{env.DNSAccessKeySecret}}
        TASK_DNS_SECURITY_TOKEN: ${{ env.DNSSecurityToken }}
        TASK_CDN_ACCESS_KEY_ID: ${{env.CDNAccessKeyId}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{env.CDNAccessKeySecret}}
        TASK_CDN_SECURITY_TOKEN: ${{ env.CDNSecurityToken }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINICUA}}
      id: renew_3
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINICUA}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{env.DNSAccessKeyId}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{env.DNSAccessKeySecret}}
        TASK_DNS_SECURITY_TOKEN: ${{ env.DNSSecurityToken }}
        TASK_CDN_ACCESS_KEY_ID: ${{env.CDNAccessKeyId}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{env.CDNAccessKeySecret}}
        TASK_CDN_SECURITY_TOKEN: ${{ env.CDNSecurityToken }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINSDREAM}}
      id: renew_4
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSDREAM}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.AVAR_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.AVAR_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.AVAR_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.AVAR_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.AVAR_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.AVAR_CDN_SECURITY_TOKEN }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINSJW}}
      id: renew_5
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSJW}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.QT_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.QT_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.QT_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.QT_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.QT_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.QT_CDN_SECURITY_TOKEN }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINSQTWL}}
      id: renew_6
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSQTWL}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.QT_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.QT_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.QT_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.QT_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.QT_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.QT_CDN_SECURITY_TOKEN }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINVQTWL}}
      id: renew_7
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINVQTWL}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.QT_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.QT_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.QT_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.QT_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.QT_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.QT_CDN_SECURITY_TOKEN }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINGKZYB}}
      id: renew_8
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINGKZYB}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.QT_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.QT_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.QT_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.QT_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.QT_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.QT_CDN_SECURITY_TOKEN }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINSJOY}}
      id: renew_9
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSJOY}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.SJOY_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.SJOY_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.SJOY_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.SEED_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.SEED_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.SEED_CDN_SECURITY_TOKEN }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --platform=tencent --cdn-platform=aliyun --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINSSEED}}
      id: renew_10
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSSEED}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.SSEED_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.SSEED_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.SSEED_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.SEED_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.SEED_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.SEED_CDN_SECURITY_TOKEN }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --platform=tencent --cdn-platform=aliyun --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"
    - name: ${{vars.DOMAINSJAYNA}}
      id: renew_11
      continue-on-error: true
      env:
        TASK_DOMAIN: ${{vars.DOMAINSJAYNA}}
        TASK_EMAIL: ${{env.EMAIL}}
        TASK_DNS_ACCESS_KEY_ID: ${{secrets.SJAYNA_DNS_AK}}
        TASK_DNS_ACCESS_KEY_SECRET: ${{secrets.SJAYNA_DNS_SK}}
        TASK_DNS_SECURITY_TOKEN: ${{ secrets.SJAYNA_DNS_SECURITY_TOKEN }}
        TASK_CDN_ACCESS_KEY_ID: ${{secrets.SJAYNA_CDN_AK}}
        TASK_CDN_ACCESS_KEY_SECRET: ${{secrets.SJAYNA_CDN_SK}}
        TASK_CDN_SECURITY_TOKEN: ${{ secrets.SJAYNA_CDN_SECURITY_TOKEN }}
      run: ./AutoCert --renew --domain="$TASK_DOMAIN" --email="$TASK_EMAIL" --product=cdn --dns-access-key-id="$TASK_DNS_ACCESS_KEY_ID" --dns-access-key-secret="$TASK_DNS_ACCESS_KEY_SECRET" --cdn-access-key-id="$TASK_CDN_ACCESS_KEY_ID" --cdn-access-key-secret="$TASK_CDN_ACCESS_KEY_SECRET" --dns-security-token="$TASK_DNS_SECURITY_TOKEN" --cdn-security-token="$TASK_CDN_SECURITY_TOKEN"

    - name: Report renewal failures
      if: ${{ always() && contains(steps.*.outcome, 'failure') }}
      run: exit 1
